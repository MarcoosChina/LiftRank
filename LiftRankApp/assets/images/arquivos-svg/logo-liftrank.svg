<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Fundo Sólido App/Splash (#0E0B1E) -->
  <rect width="128" height="128" fill="#0E0B1E" />
  
  <!-- Grade 32x32 escalada por 4x inteiro (cada pixel = 4x4 unidades exatas do viewBox) -->
  <g transform="scale(4)">
    <!-- CONTORNO EXTERNO DOURADO / AMARELO (#F5B50A base, #FFC93C luz superior) -->
    <!-- Anilha Esquerda (Contorno Exato 1px ao redor do contorno interno escuro) -->
    <rect x="6" y="5" width="6" height="1" fill="#FFC93C" />
    <rect x="5" y="6" width="1" height="2" fill="#FFC93C" /><rect x="12" y="6" width="1" height="2" fill="#F5B50A" />
    <rect x="4" y="8" width="1" height="2" fill="#FFC93C" />
    <rect x="2" y="10" width="2" height="1" fill="#FFC93C" />
    <rect x="1" y="11" width="1" height="10" fill="#F5B50A" />
    <rect x="1" y="11" width="1" height="4" fill="#FFC93C" />
    <rect x="2" y="21" width="2" height="1" fill="#F5B50A" />
    <rect x="4" y="22" width="1" height="2" fill="#F5B50A" />
    <rect x="5" y="24" width="1" height="2" fill="#F5B50A" /><rect x="12" y="24" width="1" height="2" fill="#F5B50A" />
    <rect x="6" y="26" width="6" height="1" fill="#F5B50A" />

    <!-- Anilha Direita (Contorno Exato 1px ao redor do contorno interno escuro) -->
    <rect x="20" y="3" width="6" height="1" fill="#FFC93C" />
    <rect x="19" y="4" width="1" height="2" fill="#FFC93C" /><rect x="26" y="4" width="1" height="2" fill="#F5B50A" />
    <rect x="18" y="6" width="1" height="6" fill="#FFC93C" /><rect x="27" y="6" width="1" height="2" fill="#F5B50A" />
    <rect x="28" y="8" width="2" height="1" fill="#FFC93C" />
    <rect x="30" y="9" width="1" height="10" fill="#F5B50A" />
    <rect x="30" y="9" width="1" height="4" fill="#FFC93C" />
    <rect x="28" y="19" width="2" height="1" fill="#F5B50A" />
    <rect x="27" y="20" width="1" height="2" fill="#F5B50A" />
    <rect x="18" y="18" width="1" height="4" fill="#F5B50A" /><rect x="26" y="22" width="1" height="2" fill="#F5B50A" />
    <rect x="19" y="22" width="1" height="2" fill="#F5B50A" />
    <rect x="20" y="24" width="6" height="1" fill="#F5B50A" />

    <!-- CONTORNO INTERNO ESCURO (#090A10) -->
    <!-- Anilha Esquerda -->
    <rect x="6" y="6" width="6" height="1" fill="#090A10" />
    <rect x="5" y="8" width="2" height="2" fill="#090A10" />
    <rect x="3" y="11" width="2" height="1" fill="#090A10" />
    <rect x="2" y="12" width="1" height="9" fill="#090A10" />
    <rect x="3" y="20" width="2" height="1" fill="#090A10" />
    <rect x="5" y="22" width="2" height="2" fill="#090A10" />
    <rect x="6" y="25" width="6" height="1" fill="#090A10" />
    <rect x="12" y="8" width="1" height="16" fill="#090A10" />

    <!-- Barra Central -->
    <rect x="13" y="12" width="6" height="1" fill="#090A10" />
    <rect x="13" y="17" width="6" height="1" fill="#090A10" />

    <!-- Anilha Direita -->
    <rect x="20" y="4" width="6" height="1" fill="#090A10" />
    <rect x="19" y="6" width="1" height="6" fill="#090A10" />
    <rect x="26" y="6" width="2" height="2" fill="#090A10" />
    <rect x="28" y="9" width="2" height="1" fill="#090A10" />
    <rect x="29" y="10" width="1" height="9" fill="#090A10" />
    <rect x="28" y="18" width="2" height="1" fill="#090A10" />
    <rect x="26" y="20" width="2" height="2" fill="#090A10" />
    <rect x="19" y="18" width="1" height="4" fill="#090A10" />
    <rect x="20" y="23" width="6" height="1" fill="#090A10" />

    <!-- HALTER ESQUERDO: AZUL / CIANO (#1282DB base, #3AE3FF luz, #0B4F9E sombra) -->
    <!-- Ponta Externa -->
    <rect x="3" y="12" width="2" height="8" fill="#3D136D" />
    <rect x="3" y="12" width="1" height="3" fill="#814CD6" />
    <!-- Disco Branco / Ciano Claro -->
    <rect x="5" y="10" width="2" height="12" fill="#E6FAFF" />
    <rect x="5" y="9" width="2" height="2" fill="#3AE3FF" />
    <rect x="6" y="11" width="1" height="10" fill="#FFFFFF" />
    <rect x="5" y="21" width="2" height="2" fill="#814CD6" />
    <!-- Disco Principal Azul / Ciano -->
    <rect x="7" y="7" width="5" height="18" fill="#1282DB" />
    <rect x="8" y="7" width="4" height="3" fill="#3AE3FF" />
    <rect x="9" y="9" width="3" height="14" fill="#3AE3FF" />
    <rect x="10" y="9" width="1" height="12" fill="#FFFFFF" />
    <rect x="7" y="23" width="5" height="2" fill="#0B4F9E" />

    <!-- BARRA CENTRAL (#19122B escuro, #4C268F médio, #814CD6 luz) -->
    <rect x="13" y="13" width="6" height="4" fill="#4C268F" />
    <rect x="13" y="13" width="6" height="1" fill="#814CD6" />
    <rect x="14" y="13" width="3" height="1" fill="#E6FAFF" />
    <rect x="13" y="16" width="6" height="1" fill="#19122B" />

    <!-- HALTER DIREITO: ROXO / ROSA (#8B3CB5 base, #E85D9E rosa, #31155C sombra) -->
    <!-- Disco Interno Escuro -->
    <rect x="20" y="5" width="3" height="18" fill="#31155C" />
    <rect x="19" y="6" width="1" height="6" fill="#3AE3FF" />
    <rect x="20" y="6" width="1" height="4" fill="#814CD6" />
    <!-- Disco Principal Roxo / Rosa -->
    <rect x="23" y="5" width="3" height="18" fill="#8B3CB5" />
    <rect x="23" y="5" width="2" height="3" fill="#DCA1FF" />
    <rect x="25" y="6" width="2" height="15" fill="#E85D9E" />
    <rect x="25" y="7" width="1" height="4" fill="#FFD1E6" />
    <rect x="23" y="21" width="3" height="2" fill="#31155C" />
    <!-- Ponta Externa -->
    <rect x="27" y="10" width="2" height="8" fill="#E85D9E" />
    <rect x="27" y="10" width="2" height="2" fill="#FFC93C" />
    <rect x="27" y="16" width="2" height="2" fill="#8B3CB5" />
  </g>
</svg>