<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Contorno Preto (#090A10) -->
  <!-- Ponta da Seta (Diagonal Superior Direita) -->
  <rect x="20" y="4" width="9" height="1" fill="#090A10" />
  <rect x="19" y="5" width="1" height="2" fill="#090A10" />
  <rect x="29" y="5" width="1" height="9" fill="#090A10" />
  <rect x="20" y="7" width="2" height="1" fill="#090A10" />
  <rect x="26" y="14" width="3" height="1" fill="#090A10" />
  <rect x="25" y="12" width="1" height="2" fill="#090A10" />

  <!-- Borda Superior da Segunda Subida -->
  <rect x="19" y="8" width="2" height="2" fill="#090A10" />
  <rect x="17" y="10" width="2" height="2" fill="#090A10" />
  <rect x="15" y="12" width="2" height="2" fill="#090A10" />

  <!-- Borda Superior da Quebra (Vale Central) -->
  <rect x="12" y="13" width="3" height="1" fill="#090A10" />
  <rect x="10" y="12" width="2" height="1" fill="#090A10" />

  <!-- Borda Superior da Primeira Subida -->
  <rect x="8" y="12" width="2" height="2" fill="#090A10" />
  <rect x="6" y="14" width="2" height="2" fill="#090A10" />
  <rect x="4" y="16" width="2" height="2" fill="#090A10" />
  <rect x="2" y="18" width="2" height="2" fill="#090A10" />

  <!-- Base Esquerda -->
  <rect x="1" y="20" width="1" height="4" fill="#090A10" />
  <rect x="2" y="24" width="3" height="1" fill="#090A10" />

  <!-- Borda Inferior da Primeira Subida -->
  <rect x="5" y="22" width="2" height="2" fill="#090A10" />
  <rect x="7" y="20" width="2" height="2" fill="#090A10" />
  <rect x="9" y="18" width="2" height="2" fill="#090A10" />

  <!-- Borda Inferior da Quebra (Vértice de Fundo) -->
  <rect x="11" y="19" width="2" height="1" fill="#090A10" />
  <rect x="13" y="20" width="3" height="1" fill="#090A10" />

  <!-- Borda Inferior da Segunda Subida -->
  <rect x="16" y="18" width="2" height="2" fill="#090A10" />
  <rect x="18" y="16" width="2" height="2" fill="#090A10" />
  <rect x="20" y="14" width="2" height="2" fill="#090A10" />
  <rect x="22" y="12" width="3" height="1" fill="#090A10" />

  <!-- Preenchimento Verde (#22D45F base, #7CFF9E luz, #118A3B sombra) -->
  <!-- 1ª Subida (Arrancada da Base) -->
  <rect x="2" y="20" width="3" height="4" fill="#22D45F" />
  <rect x="4" y="18" width="3" height="4" fill="#22D45F" />
  <rect x="6" y="16" width="3" height="4" fill="#22D45F" />
  <rect x="8" y="14" width="2" height="4" fill="#22D45F" />
  <!-- Luzes 1ª Subida -->
  <rect x="2" y="20" width="2" height="1" fill="#7CFF9E" />
  <rect x="4" y="18" width="2" height="1" fill="#7CFF9E" />
  <rect x="6" y="16" width="2" height="1" fill="#7CFF9E" />
  <rect x="8" y="14" width="2" height="1" fill="#7CFF9E" />
  <!-- Sombras 1ª Subida -->
  <rect x="3" y="23" width="2" height="1" fill="#118A3B" />
  <rect x="5" y="21" width="2" height="1" fill="#118A3B" />
  <rect x="7" y="19" width="2" height="1" fill="#118A3B" />

  <!-- Quebra (Recuo Central / Correção) -->
  <rect x="10" y="13" width="2" height="5" fill="#22D45F" />
  <rect x="11" y="15" width="3" height="4" fill="#22D45F" />
  <rect x="13" y="14" width="2" height="6" fill="#22D45F" />
  <rect x="11" y="18" width="2" height="1" fill="#118A3B" />
  <rect x="13" y="19" width="3" height="1" fill="#118A3B" />

  <!-- 2ª Subida (Retomada até a Ponta) -->
  <rect x="15" y="14" width="2" height="4" fill="#22D45F" />
  <rect x="17" y="12" width="2" height="4" fill="#22D45F" />
  <rect x="19" y="10" width="2" height="4" fill="#22D45F" />
  <rect x="21" y="8" width="2" height="4" fill="#22D45F" />
  <!-- Luzes 2ª Subida -->
  <rect x="15" y="14" width="2" height="1" fill="#7CFF9E" />
  <rect x="17" y="12" width="2" height="1" fill="#7CFF9E" />
  <rect x="19" y="10" width="2" height="1" fill="#7CFF9E" />
  <rect x="21" y="8" width="2" height="1" fill="#7CFF9E" />
  <!-- Sombras 2ª Subida -->
  <rect x="16" y="17" width="2" height="1" fill="#118A3B" />
  <rect x="18" y="15" width="2" height="1" fill="#118A3B" />
  <rect x="20" y="13" width="2" height="1" fill="#118A3B" />

  <!-- Ponta da Seta -->
  <rect x="20" y="5" width="9" height="2" fill="#22D45F" />
  <rect x="22" y="7" width="7" height="5" fill="#22D45F" />
  <rect x="26" y="12" width="3" height="2" fill="#118A3B" />
  <rect x="20" y="5" width="8" height="1" fill="#7CFF9E" />
  <rect x="28" y="6" width="1" height="6" fill="#7CFF9E" />
</svg>